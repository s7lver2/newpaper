[package]
name = "np-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "np_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
np-shell = { path = "crates/np-shell" }
np-store = { path = "crates/np-store" }
np-adblock = { path = "crates/np-adblock" }
np-net = { path = "crates/np-net" }
np-feeds = { path = "crates/np-feeds" }
np-lexicon = { path = "crates/np-lexicon" }
np-wayback = { path = "crates/np-wayback" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { workspace = true }
reqwest = { workspace = true }
percent-encoding = "2.3"
chrono = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }


[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.dependencies]
tauri = { version = "~2.12", features = ["unstable"] }
tauri-build = { version = "2.7.1", features = [] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "gzip", "socks", "http2"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.27", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
tracing = "0.1"
async-trait = "0.1.92"
futures = "0.3"
tempfile = "3.27"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation"] }
windows-core = "0.62.2"