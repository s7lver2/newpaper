[package]
name = "np-net"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "geoip"] }
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"] }
async-trait = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
# Sin dependencia directa, `-p np-net` enlaza sqlite3.lib del sistema (tor-dirmgr no activa `bundled`).
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
