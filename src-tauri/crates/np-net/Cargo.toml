[package]
name = "np-net"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
# Sin dependencia directa, `-p np-net` enlaza sqlite3.lib del sistema (tor-dirmgr no activa `bundled`).
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
tracing = { workspace = true }

# Tor (Arti) en escritorio y Android. iOS queda fuera (subproyecto 8). Mismo cliente y TLS (rustls) en ambos.
[target.'cfg(not(target_os = "ios"))'.dependencies]
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "geoip"] }
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"] }

# Android: el verificador de la plataforma de rustls exige inicializar la JVM y un componente Kotlin; se usan las raíces Mozilla.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "=1.0.9"

[dev-dependencies]
tempfile = { workspace = true }
