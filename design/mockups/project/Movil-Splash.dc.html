<style>
/*@m-base*/
/* newpaper móvil · base compartida de los artboards Movil-*.dc.html.
   FUENTE ÚNICA: este fichero. Se copia entre los marcadores @m-base de cada artboard con
   `node design/mockups/tools/inject-base.mjs` (no editar la copia a mano). */
:root{
  --np-paper:#F6F4EF;--np-chrome:#E7E3DA;--np-panel:#FBFAF7;--np-card:#FFFFFF;--np-ink:#17171A;--np-ink2:#3D3B37;--np-muted:#5E5B55;--np-faint:#8D8981;
  --np-line:#E2DED5;--np-line2:#EFECE6;--np-line3:#D9D5CC;--np-soft:#EFECE5;--np-switch-off:#CFCAC0;--np-accent:#2340B8;--np-accent-soft:#E8ECFA;--np-accent-sel:#DCE3FA;
  --np-ok:#0B6B50;--np-ok-bg:#E3F2EC;--np-warn:#8A5300;--np-warn-bg:#FBF0DC;--np-bad:#A3271B;--np-bad-bg:#FBE7E4;--np-left:#C2412F;--np-center:#B9B4A9;--np-right:#2F5BD3;
  --np-tor:#4A2FB8;--np-tor-soft:#ECE8FB;--np-ai:#993556;--np-ai-bg:#FBEAF0;--np-on-ink:#F6F4EF;
  --np-font-read:'Newsreader',Georgia,serif;--np-font-ui:'IBM Plex Sans',system-ui,sans-serif;--np-font-mono:'IBM Plex Mono',ui-monospace,monospace;
  /* movimiento: duraciones */
  --m-dur-press:90ms;--m-dur-fast:160ms;--m-dur-base:280ms;--m-dur-slow:420ms;--m-dur-emph:560ms;--m-dur-sheet:380ms;--m-dur-ring:900ms;--m-dur-shimmer:1400ms;--m-dur-scan:2200ms;--m-stagger:45ms;--m-dur-intro:2920ms;--m-dur-intro-short:1080ms;--m-dur-intro-reduce:800ms;--m-dur-iris:360ms;--m-dur-packet:1500ms;--m-par-art:.65;--m-par-text:1.25;
  /* movimiento: curvas */
  --m-ease:cubic-bezier(.22,1,.36,1);--m-ease-emph:cubic-bezier(.05,.7,.1,1);--m-ease-exit:cubic-bezier(.3,0,.8,.15);--m-ease-inout:cubic-bezier(.65,0,.35,1);--m-spring:cubic-bezier(.34,1.56,.64,1);
  /* medidas */
  --m-top:32px;--m-bottom:20px;--m-hit:48px;--m-gutter:20px;--m-appbar:56px;--m-tabbar:64px;--m-r-card:20px;--m-r-ctl:16px;
}
body{margin:0}
.m-app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--np-paper);color:var(--np-ink);font:400 15px/1.45 var(--np-font-ui);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.m-app,.m-app *{box-sizing:border-box}
:where(.m-app) a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
:where(.m-app) button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0;-webkit-tap-highlight-color:transparent;transition:transform var(--m-dur-press) var(--m-ease),background-color var(--m-dur-fast) var(--m-ease),color var(--m-dur-fast) var(--m-ease),border-color var(--m-dur-fast) var(--m-ease),opacity var(--m-dur-fast) var(--m-ease)}
.m-app button:active:not(:disabled),.m-app a.m-tap:active{transform:scale(.97)}
.m-app a.m-tap{transition:transform var(--m-dur-press) var(--m-ease),background-color var(--m-dur-fast) var(--m-ease)}
.m-app :focus-visible{outline:2px solid var(--np-accent);outline-offset:2px}
:where(.m-app) input{font:inherit;color:inherit}
:where(.m-app) svg{flex:none}
.m-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.m-scroll::-webkit-scrollbar{display:none}
.m-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* barras */
.m-appbar{flex:none;display:flex;align-items:center;gap:4px;height:calc(var(--m-appbar) + var(--m-top));padding:var(--m-top) 8px 0}
.m-back{flex:none;width:var(--m-hit);height:var(--m-hit);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--np-ink)}
.m-back:active{background:var(--np-soft)}
.m-bar-title{flex:1;min-width:0;font:500 21px/1.15 var(--np-font-read);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-bar-sub{display:block;font:400 12px/1.3 var(--np-font-ui);color:var(--np-muted);letter-spacing:0}
.m-bar-act{flex:none;min-width:var(--m-hit);height:var(--m-hit);border-radius:24px;display:flex;align-items:center;justify-content:center;padding:0 12px;font-weight:500;color:var(--np-accent)}
.m-large{padding:calc(var(--m-top) + 20px) var(--m-gutter) 4px;font:500 36px/1.04 var(--np-font-read);letter-spacing:-.025em}
.m-kicker{font:600 11px/1.4 var(--np-font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--np-muted)}
.m-sec{margin:26px var(--m-gutter) 8px;font:600 12px/1.3 var(--np-font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--np-muted);display:flex;justify-content:space-between;align-items:baseline}
.m-sec small{font:400 12px var(--np-font-ui);letter-spacing:0;text-transform:none;color:var(--np-faint)}
/* grupos y filas */
.m-group{margin:0 16px;background:var(--np-card);border:1px solid var(--np-line2);border-radius:var(--m-r-card);overflow:hidden}
.m-row{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:10px 16px;text-align:left;background:none}
.m-row+.m-row::before,.m-row-wrap+.m-row-wrap::before{content:'';position:absolute;left:66px;right:0;top:0;height:1px;background:var(--np-line2)}
.m-row-wrap{position:relative}
button.m-row:active,a.m-row:active{background:var(--np-soft);transform:none!important}
.m-ico{flex:none;width:36px;height:36px;border-radius:11px;background:var(--np-soft);color:var(--np-ink);display:flex;align-items:center;justify-content:center}
.m-ico svg{width:20px;height:20px}
.m-ico.ok{background:var(--np-ok-bg);color:var(--np-ok)}.m-ico.acc{background:var(--np-accent-soft);color:var(--np-accent)}.m-ico.warn{background:var(--np-warn-bg);color:var(--np-warn)}.m-ico.bad{background:var(--np-bad-bg);color:var(--np-bad)}.m-ico.tor{background:var(--np-tor-soft);color:var(--np-tor)}.m-ico.ai{background:var(--np-ai-bg);color:var(--np-ai)}.m-ico.ink{background:var(--np-ink);color:var(--np-on-ink)}
.m-rt{flex:1;min-width:0}
.m-rt>b{display:block;font:500 16px/1.3 var(--np-font-ui)}
.m-rt>span{display:block;font:400 13px/1.4 var(--np-font-ui);color:var(--np-muted);margin-top:1px}
.m-val{flex:none;font:400 14px var(--np-font-ui);color:var(--np-muted);max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-chev{flex:none;color:var(--np-faint)}
.m-note{margin:8px 20px 0;font:400 12.5px/1.5 var(--np-font-ui);color:var(--np-muted)}
/* interruptor */
.m-switch{position:relative;flex:none;width:52px;height:32px;border-radius:16px;background:var(--np-switch-off);transition:background-color var(--m-dur-base) var(--m-ease)!important}
.m-switch::before{content:'';position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(23,23,26,.3);transition:transform var(--m-dur-base) var(--m-spring),width var(--m-dur-fast) var(--m-ease)}
.m-switch::after{content:'';position:absolute;inset:-8px -4px}
.m-switch[aria-checked=true]{background:var(--np-ink)}
.m-switch[aria-checked=true]::before{transform:translateX(20px)}
.m-switch:active::before{width:28px}
.m-switch[aria-checked=true]:active::before{transform:translateX(16px)}
/* botones y chips */
.m-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 24px;border-radius:var(--m-r-ctl);background:var(--np-ink);color:var(--np-on-ink)!important;font:600 16px var(--np-font-ui)}
.m-btn.sec{background:transparent;color:var(--np-ink)!important;box-shadow:inset 0 0 0 1.5px var(--np-line3)}
.m-btn.soft{background:var(--np-soft);color:var(--np-ink)!important}
.m-btn.acc{background:var(--np-accent)}
.m-btn.danger{background:var(--np-bad-bg);color:var(--np-bad)!important}
.m-btn.sm{height:48px;font-size:15px;border-radius:14px}
.m-chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:20px;background:var(--np-card);box-shadow:inset 0 0 0 1px var(--np-line3);font:500 14px var(--np-font-ui);position:relative}
.m-chip::after{content:'';position:absolute;inset:-4px 0}
.m-chip[aria-pressed=true]{background:var(--np-ink);color:var(--np-on-ink);box-shadow:none}
.m-seg{display:flex;padding:4px;border-radius:18px;background:var(--np-chrome);gap:2px}
.m-seg>button{flex:1;height:44px;border-radius:14px;font:500 14px var(--np-font-ui);color:var(--np-muted)}
.m-seg>button[aria-selected=true],.m-seg>button[aria-pressed=true]{background:var(--np-card);color:var(--np-ink);box-shadow:0 1px 3px rgba(23,23,26,.14)}
.m-card{background:var(--np-card);border:1px solid var(--np-line2);border-radius:var(--m-r-card)}
.m-leanbar{display:flex;gap:1px;height:4px;border-radius:2px;overflow:hidden}
.m-leanbar i{display:block}.m-leanbar i:nth-child(1){background:var(--np-left)}.m-leanbar i:nth-child(2){background:var(--np-center)}.m-leanbar i:nth-child(3){background:var(--np-right)}
/* barra de pestañas */
.m-tabbar{flex:none;position:relative;display:grid;grid-template-columns:repeat(4,1fr);height:calc(var(--m-tabbar) + var(--m-bottom));padding:0 4px var(--m-bottom);background:var(--np-paper);border-top:1px solid var(--np-line)}
.m-tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding-top:8px;color:var(--np-muted);font:500 12px/1 var(--np-font-ui);min-height:var(--m-hit)}
.m-tab .pill{position:relative;width:64px;height:32px;display:flex;align-items:center;justify-content:center}
.m-tab .pill::before{content:'';position:absolute;inset:0;border-radius:16px;background:var(--np-accent-soft);transform:scaleX(.35);opacity:0;transition:transform var(--m-dur-base) var(--m-ease),opacity var(--m-dur-fast) var(--m-ease)}
.m-tab svg{position:relative;width:24px;height:24px;transition:transform var(--m-dur-base) var(--m-spring)}
.m-tab[aria-current=page]{color:var(--np-ink)}
.m-tab[aria-current=page] .pill::before{transform:none;opacity:1}
.m-tab[aria-current=page] svg{color:var(--np-accent)}
.m-tab[aria-current=page] .fill{fill:currentColor;fill-opacity:.16}
.m-tab:active svg{transform:scale(.88)}
.m-tab .badge{position:absolute;top:2px;right:16px;min-width:8px;height:8px;border-radius:4px;background:var(--np-left);box-shadow:0 0 0 2px var(--np-paper)}
/* hoja inferior */
.m-scrim{position:absolute;inset:0;background:rgba(23,23,26,.42);animation:m-fade var(--m-dur-base) var(--m-ease) both;z-index:20}
.m-sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--np-card);border-radius:28px 28px 0 0;padding:12px 20px calc(var(--m-bottom) + 12px);box-shadow:0 -12px 40px rgba(23,23,26,.18);animation:m-sheet var(--m-dur-sheet) var(--m-spring) both}
.m-grab{width:36px;height:4px;border-radius:2px;background:var(--np-line3);margin:0 auto 14px}
/* esqueletos */
.m-skel{display:block;border-radius:8px;background:linear-gradient(100deg,var(--np-chrome) 30%,#F4F1EB 50%,var(--np-chrome) 70%);background-size:300% 100%;animation:m-shimmer var(--m-dur-shimmer) linear infinite}
/* animaciones */
.m-rise{animation:m-rise var(--m-dur-slow) var(--m-ease) both}
.m-enter{animation:m-push-in var(--m-dur-base) var(--m-ease-emph) both}
.m-fadein{animation:m-fade var(--m-dur-base) var(--m-ease) both}
.m-pop{animation:m-pop var(--m-dur-slow) var(--m-spring) both}
.m-stagger>*{animation:m-rise var(--m-dur-slow) var(--m-ease) both;animation-delay:calc(var(--i,0)*var(--m-stagger))}
.m-stagger>*:nth-child(2){--i:1}.m-stagger>*:nth-child(3){--i:2}.m-stagger>*:nth-child(4){--i:3}.m-stagger>*:nth-child(5){--i:4}.m-stagger>*:nth-child(6){--i:5}.m-stagger>*:nth-child(7){--i:6}.m-stagger>*:nth-child(8){--i:7}.m-stagger>*:nth-child(n+9){--i:8}
@keyframes m-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes m-fade{from{opacity:0}to{opacity:1}}
@keyframes m-push-in{from{opacity:.4;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes m-push-under{from{transform:none}to{transform:translateX(-24%);opacity:.6}}
@keyframes m-pop-out{from{transform:none;opacity:1}to{transform:translateX(32px);opacity:0}}
@keyframes m-sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes m-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes m-shimmer{from{background-position:100% 0}to{background-position:-200% 0}}
@keyframes m-ring{from{stroke-dashoffset:var(--len,100)}to{stroke-dashoffset:var(--to,0)}}
@keyframes m-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes m-pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes m-spin{to{transform:rotate(360deg)}}
@keyframes m-scan{0%{transform:translateY(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(var(--h,240px));opacity:0}}
@keyframes m-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){
  .m-app *,.m-app *::before,.m-app *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .m-skel{animation:none!important;background:var(--np-chrome)}
}
/* simulación de "reducir movimiento" (los mockups la activan con la clase m-reduce en la raíz) */
.m-reduce *,.m-reduce *::before,.m-reduce *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
.m-reduce .m-skel{animation:none!important;background:var(--np-chrome)}
.m-btn.paper{background:var(--np-on-ink);color:var(--np-ink)!important}
.m-app>.m-tabbar{margin-top:auto}
/* ojo de la lente (Analisis): abierto = lente activa; cerrado = inactiva. Morfa el contorno con d (CSS) y apaga la pupila. */
.m-lens .lid{d:path("M2.5 12C5 7.5 8.3 5.5 12 5.5C15.7 5.5 19 7.5 21.5 12C19 16.5 15.7 18.5 12 18.5C8.3 18.5 5 16.5 2.5 12Z");transition:d var(--m-dur-base) var(--m-ease-inout)}
.m-lens[aria-pressed=false] .lid{d:path("M2.5 9.5C5 14.5 8.3 16.5 12 16.5C15.7 16.5 19 14.5 21.5 9.5C19 12.5 15.7 13.5 12 13.5C8.3 13.5 5 12.5 2.5 9.5Z")}
.m-lens .pupil{transform-box:fill-box;transform-origin:center;transform:scale(1);opacity:1;transition:transform var(--m-dur-base) var(--m-spring),opacity var(--m-dur-fast) var(--m-ease)}
.m-lens[aria-pressed=false] .pupil{transform:scale(.2);opacity:0}
.m-lens .lash{opacity:0;transition:opacity var(--m-dur-fast) var(--m-ease) 0ms}
.m-lens[aria-pressed=false] .lash{opacity:1;transition-delay:var(--m-dur-fast)}
@media (prefers-reduced-motion:reduce){.m-lens .lid,.m-lens .pupil,.m-lens .lash{transition:none}}
/*@m-base-end*/
.in-ctl{position:absolute;left:10px;right:10px;top:calc(var(--m-top) + 2px);z-index:9;background:rgba(246,244,239,.1);backdrop-filter:blur(6px);border-radius:16px;padding:8px 10px 8px;color:#CBC7BE;font:500 12px var(--np-font-mono)}
.in-seg{display:flex;gap:4px}
.in-seg button{flex:1;height:36px;border-radius:10px;font:500 12px var(--np-font-ui);color:#CBC7BE;box-shadow:inset 0 0 0 1px rgba(246,244,239,.22)}
.in-seg button[aria-pressed=true]{background:#F6F4EF;color:#17171A;box-shadow:none}
.in-ctl input[type=range]{width:100%;height:28px;accent-color:#F6F4EF;margin:6px 0 0}
.in-row{display:flex;align-items:center;gap:8px}
.in-row button{flex:none;width:44px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#F6F4EF;box-shadow:inset 0 0 0 1px rgba(246,244,239,.22)}
</style>
