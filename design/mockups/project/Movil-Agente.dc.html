<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Móvil · agente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap">
<style>
body{margin:0}
a{color:#17171A;text-decoration:none}
button,input{font:inherit}
button{cursor:pointer;transition:background-color .45s cubic-bezier(.22,1,.36,1),color .45s,transform .5s cubic-bezier(.34,1.56,.64,1)}
input:focus{outline:none;border-color:#2340B8!important}
.scr{scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
.rise{animation:rise .7s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F4EF; color: #17171A; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 8px; padding: 50px 12px 10px; border-bottom: 1px solid #E2DED5">
<a href="Movil-Analisis.dc.html" aria-label="Volver" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="flex: 1; min-width: 0"><div style="font-weight: 600">Agente</div><div style="font-size: 11px; color: #5E5B55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">El salario mínimo bate récords… · 6 coberturas · 9 fuentes</div></div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #5E5B55; border: 1px solid #D9D5CC; border-radius: 6px; padding: 3px 6px">Claude</span>
</div>
<div class="scr" style="flex: 1; overflow-y: auto; padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 18px">
<sc-for list="{{messages}}" as="m" hint-placeholder-count="2">
<sc-if value="{{m.user}}" hint-placeholder-val="{{ true }}">
<div class="rise" style="align-self: flex-end; max-width: 86%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<sc-if value="{{m.hasSnip}}" hint-placeholder-val="{{ false }}"><div style="font-family: 'Newsreader', serif; font-style: italic; font-size: 14px; color: #3D3B37; border-left: 2px solid #2340B8; padding: 2px 0 2px 10px; text-align: left; border-radius: 0">«{{m.snip}}»</div></sc-if>
<div style="background: #17171A; color: #F6F4EF; padding: 10px 14px; border-radius: 16px 16px 4px 16px; line-height: 1.45">{{m.text}}</div>
</div>
</sc-if>
<sc-if value="{{m.bot}}" hint-placeholder-val="{{ false }}">
<div class="rise" style="display: flex; flex-direction: column; gap: 10px">
<button onClick="{{m.toggleSteps}}" style="align-self: flex-start; border: 0; background: transparent; padding: 0; font-size: 12px; color: #5E5B55"><span style="{{m.chev}}">›</span> {{m.stepsLabel}}</button>
<sc-if value="{{m.showSteps}}" hint-placeholder-val="{{ false }}"><div class="rise" style="padding-left: 12px; border-left: 1px solid #E2DED5; display: flex; flex-direction: column; gap: 4px; border-radius: 0"><sc-for list="{{m.steps}}" as="st" hint-placeholder-count="3"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5E5B55">{{st}}</span></sc-for></div></sc-if>
<div style="font-family: 'Newsreader', serif; font-size: 17px; line-height: 1.6"><sc-for list="{{m.segs}}" as="g" hint-placeholder-count="3"><sc-if value="{{g.isCite}}" hint-placeholder-val="{{ false }}"><button onClick="{{g.pick}}" style="{{g.style}}">{{g.n}}</button></sc-if><sc-if value="{{g.isText}}" hint-placeholder-val="{{ true }}"><span>{{g.t}}</span></sc-if></sc-for></div>
<div style="display: flex; flex-direction: column; gap: 2px"><sc-for list="{{m.sources}}" as="src" hint-placeholder-count="2"><div style="{{src.style}}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #2340B8; min-width: 16px">{{src.n}}</span>{{src.name}}</div></sc-for></div>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{m.follow}}" as="f" hint-placeholder-count="2"><button onClick="{{f.ask}}" style="height: 34px; padding: 0 12px; border: 1px solid #D9D5CC; border-radius: 999px; background: #FFFFFF; font-size: 12px; color: #17171A">{{f.q}}</button></sc-for></div>
</div>
</sc-if>
</sc-for>
<sc-if value="{{thinking}}" hint-placeholder-val="{{ false }}">
<div class="rise" style="display: flex; flex-direction: column; gap: 8px"><sc-for list="{{live}}" as="l" hint-placeholder-count="3"><div style="{{l.s}}"><span style="{{l.d}}"></span>{{l.t}}</div></sc-for></div>
</sc-if>
</div>
<div style="padding: 10px 14px 28px; border-top: 1px solid #E2DED5; display: flex; flex-direction: column; gap: 8px; background: #F6F4EF">
<div style="display: flex; gap: 4px"><sc-for list="{{modes}}" as="md" hint-placeholder-count="3"><button onClick="{{md.pick}}" style="{{md.style}}">{{md.label}}</button></sc-for></div>
<form onSubmit="{{send}}" style="display: flex; gap: 8px">
<label for="mask" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tu pregunta</label>
<input id="mask" value="{{draft}}" onChange="{{onDraft}}" placeholder="Pregunta lo que quieras…" style="flex: 1; min-width: 0; height: 48px; padding: 0 16px; border: 1px solid #D9D5CC; border-radius: 24px; background: #FFFFFF; color: #17171A; font-size: 15px">
<button type="submit" aria-label="Enviar" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: #17171A; color: #F6F4EF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</form>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { mode: 'ask', draft: '', thinking: false, lv: 0, cite: null, open: {}, messages: [
      { id: 1, user: true, text: '¿Es cierto?', snip: 'sin que se haya destruido empleo' },
      { id: 2, bot: true, segs: ['Está en disputa. El aumento del 61 % es correcto ', 1, ', pero la AIReF estimó un efecto negativo moderado en jóvenes y en el campo ', 2, '. El artículo solo cita a CCOO ', 3, '.'], sources: ['INE · EPA', 'AIReF · evaluación 2023', 'CCOO · informe propio'], steps: ['Leyó el fragmento', 'Buscó la serie del SMI en el INE', 'Comparó 3 estudios'], follow: ['¿Qué dice la AIReF?', '¿Hay datos de 2026?'] }
    ] };
  }
  componentWillUnmount() { clearInterval(this.iv); }
  ask(q) {
    const s = this.state;
    this.setState({ messages: s.messages.concat([{ id: Date.now(), user: true, text: q, snip: '' }]), thinking: true, lv: 0, draft: '' });
    clearInterval(this.iv);
    this.iv = setInterval(() => {
      const n = this.state.lv + 1;
      if (n >= 3) { clearInterval(this.iv); this.setState({ thinking: false, messages: this.state.messages.concat([{ id: Date.now() + 1, bot: true, segs: ['La AIReF comparó la evolución del empleo en los grupos más expuestos a la subida con otros similares ', 1, '. Encontró menos contratación de la esperada en jóvenes y en el sector agrario, sin efecto apreciable en el total ', 1, '.'], sources: ['AIReF · evaluación del SMI 2023'], steps: ['Abrió el informe de la AIReF', 'Resumió la metodología'], follow: ['¿Y el Banco de España?'] }]) }); }
      else this.setState({ lv: n });
    }, 650);
  }
  renderVals() {
    const s = this.state, E = 'cubic-bezier(.22,1,.36,1)';
    return {
      messages: s.messages.map((m) => {
        if (m.user) return { user: true, bot: false, text: m.text, hasSnip: !!m.snip, snip: m.snip };
        const op = !!s.open[m.id];
        return { user: false, bot: true, stepsLabel: m.steps.length + ' pasos · ' + m.sources.length + ' fuentes', showSteps: op, steps: m.steps, chev: 'display:inline-block;transition:transform .4s ' + E + ';transform:rotate(' + (op ? 90 : 0) + 'deg)', toggleSteps: () => this.setState({ open: { ...s.open, [m.id]: !op } }),
          segs: m.segs.map((g) => (typeof g === 'number' ? { isCite: true, isText: false, n: g, pick: () => this.setState({ cite: m.id + ':' + g }), style: "all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;margin:0 1px;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:11px;vertical-align:2px;transition:all .4s;" + (s.cite === m.id + ':' + g ? 'background:#2340B8;color:#FFFFFF' : 'background:#E8ECFA;color:#2340B8') } : { isCite: false, isText: true, t: g })),
          sources: m.sources.map((n, i) => ({ n: i + 1, name: n, style: 'display:flex;gap:8px;align-items:baseline;font-size:12px;padding:6px 8px;border-radius:8px;transition:background-color .5s;background:' + (s.cite === m.id + ':' + (i + 1) ? '#E8ECFA' : 'transparent') })),
          follow: m.follow.map((q) => ({ q, ask: () => this.ask(q) })) };
      }),
      thinking: s.thinking,
      live: ['Leyendo el contexto', 'Buscando en fuentes', 'Redactando con citas'].map((t, i) => ({ t, s: 'display:flex;align-items:center;gap:10px;font-size:13px;color:' + (i <= s.lv ? '#17171A' : '#A9A59C'), d: 'width:8px;height:8px;border-radius:50%;' + (i < s.lv ? 'background:#0B6B50' : i === s.lv ? 'background:#2340B8;animation:pulse 1.2s infinite' : 'background:#E2DED5') })),
      modes: [['ask', 'Preguntar'], ['verify', 'Verificar'], ['explain', 'Explicar']].map((m) => ({ label: m[1], pick: () => this.setState({ mode: m[0] }), style: 'height:30px;padding:0 12px;border-radius:999px;font-size:12px;' + (s.mode === m[0] ? 'background:#17171A;color:#F6F4EF;border:1px solid #17171A' : 'background:transparent;color:#5E5B55;border:1px solid #D9D5CC') })),
      draft: s.draft, onDraft: (e) => this.setState({ draft: e.target.value }),
      send: (e) => { e.preventDefault(); const q = s.draft.trim(); if (q) this.ask(q); }
    };
  }
}
</script>
</body>
</html>
