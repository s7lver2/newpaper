<style>
/*@m-base*/
/* newpaper móvil · base compartida de los artboards Movil-*.dc.html.
   FUENTE ÚNICA: este fichero. Se copia entre los marcadores @m-base de cada artboard con
   `node design/mockups/tools/inject-base.mjs` (no editar la copia a mano). */
:root{
  --np-paper:#F6F4EF;--np-chrome:#E7E3DA;--np-panel:#FBFAF7;--np-card:#FFFFFF;--np-ink:#17171A;--np-ink2:#3D3B37;--np-muted:#5E5B55;--np-faint:#8D8981;
  --np-line:#E2DED5;--np-line2:#EFECE6;--np-line3:#D9D5CC;--np-soft:#EFECE5;--np-switch-off:#CFCAC0;--np-accent:#2340B8;--np-accent-soft:#E8ECFA;--np-accent-sel:#DCE3FA;
  --np-ok:#0B6B50;--np-ok-bg:#E3F2EC;--np-warn:#8A5300;--np-warn-bg:#FBF0DC;--np-bad:#A3271B;--np-bad-bg:#FBE7E4;--np-left:#C2412F;--np-center:#B9B4A9;--np-right:#2F5BD3;
  --np-tor:#4A2FB8;--np-tor-soft:#ECE8FB;--np-ai:#993556;--np-ai-bg:#FBEAF0;--np-on-ink:#F6F4EF;
  --np-font-read:'Newsreader',Georgia,serif;--np-font-ui:'IBM Plex Sans',system-ui,sans-serif;--np-font-mono:'IBM Plex Mono',ui-monospace,monospace;
  /* movimiento: duraciones */
  --m-dur-press:90ms;--m-dur-fast:160ms;--m-dur-base:280ms;--m-dur-slow:420ms;--m-dur-emph:560ms;--m-dur-sheet:380ms;--m-dur-ring:900ms;--m-dur-shimmer:1400ms;--m-dur-scan:2200ms;--m-stagger:45ms;
  /* movimiento: curvas */
  --m-ease:cubic-bezier(.22,1,.36,1);--m-ease-emph:cubic-bezier(.05,.7,.1,1);--m-ease-exit:cubic-bezier(.3,0,.8,.15);--m-ease-inout:cubic-bezier(.65,0,.35,1);--m-spring:cubic-bezier(.34,1.56,.64,1);
  /* medidas */
  --m-top:32px;--m-bottom:20px;--m-hit:48px;--m-gutter:20px;--m-appbar:56px;--m-tabbar:64px;--m-r-card:20px;--m-r-ctl:16px;
}
body{margin:0}
.m-app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--np-paper);color:var(--np-ink);font:400 15px/1.45 var(--np-font-ui);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.m-app,.m-app *{box-sizing:border-box}
:where(.m-app) a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
:where(.m-app) button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0;-webkit-tap-highlight-color:transparent;transition:transform var(--m-dur-press) var(--m-ease),background-color var(--m-dur-fast) var(--m-ease),color var(--m-dur-fast) var(--m-ease),border-color var(--m-dur-fast) var(--m-ease),opacity var(--m-dur-fast) var(--m-ease)}
.m-app button:active:not(:disabled),.m-app a.m-tap:active{transform:scale(.97)}
.m-app a.m-tap{transition:transform var(--m-dur-press) var(--m-ease),background-color var(--m-dur-fast) var(--m-ease)}
.m-app :focus-visible{outline:2px solid var(--np-accent);outline-offset:2px}
:where(.m-app) input{font:inherit;color:inherit}
:where(.m-app) svg{flex:none}
.m-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.m-scroll::-webkit-scrollbar{display:none}
.m-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* barras */
.m-appbar{flex:none;display:flex;align-items:center;gap:4px;height:calc(var(--m-appbar) + var(--m-top));padding:var(--m-top) 8px 0}
.m-back{flex:none;width:var(--m-hit);height:var(--m-hit);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--np-ink)}
.m-back:active{background:var(--np-soft)}
.m-bar-title{flex:1;min-width:0;font:500 21px/1.15 var(--np-font-read);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-bar-sub{display:block;font:400 12px/1.3 var(--np-font-ui);color:var(--np-muted);letter-spacing:0}
.m-bar-act{flex:none;min-width:var(--m-hit);height:var(--m-hit);border-radius:24px;display:flex;align-items:center;justify-content:center;padding:0 12px;font-weight:500;color:var(--np-accent)}
.m-large{padding:calc(var(--m-top) + 20px) var(--m-gutter) 4px;font:500 36px/1.04 var(--np-font-read);letter-spacing:-.025em}
.m-kicker{font:600 11px/1.4 var(--np-font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--np-muted)}
.m-sec{margin:26px var(--m-gutter) 8px;font:600 12px/1.3 var(--np-font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--np-muted);display:flex;justify-content:space-between;align-items:baseline}
.m-sec small{font:400 12px var(--np-font-ui);letter-spacing:0;text-transform:none;color:var(--np-faint)}
/* grupos y filas */
.m-group{margin:0 16px;background:var(--np-card);border:1px solid var(--np-line2);border-radius:var(--m-r-card);overflow:hidden}
.m-row{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:10px 16px;text-align:left;background:none}
.m-row+.m-row::before,.m-row-wrap+.m-row-wrap::before{content:'';position:absolute;left:66px;right:0;top:0;height:1px;background:var(--np-line2)}
.m-row-wrap{position:relative}
button.m-row:active,a.m-row:active{background:var(--np-soft);transform:none!important}
.m-ico{flex:none;width:36px;height:36px;border-radius:11px;background:var(--np-soft);color:var(--np-ink);display:flex;align-items:center;justify-content:center}
.m-ico svg{width:20px;height:20px}
.m-ico.ok{background:var(--np-ok-bg);color:var(--np-ok)}.m-ico.acc{background:var(--np-accent-soft);color:var(--np-accent)}.m-ico.warn{background:var(--np-warn-bg);color:var(--np-warn)}.m-ico.bad{background:var(--np-bad-bg);color:var(--np-bad)}.m-ico.tor{background:var(--np-tor-soft);color:var(--np-tor)}.m-ico.ai{background:var(--np-ai-bg);color:var(--np-ai)}.m-ico.ink{background:var(--np-ink);color:var(--np-on-ink)}
.m-rt{flex:1;min-width:0}
.m-rt>b{display:block;font:500 16px/1.3 var(--np-font-ui)}
.m-rt>span{display:block;font:400 13px/1.4 var(--np-font-ui);color:var(--np-muted);margin-top:1px}
.m-val{flex:none;font:400 14px var(--np-font-ui);color:var(--np-muted);max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-chev{flex:none;color:var(--np-faint)}
.m-note{margin:8px 20px 0;font:400 12.5px/1.5 var(--np-font-ui);color:var(--np-muted)}
/* interruptor */
.m-switch{position:relative;flex:none;width:52px;height:32px;border-radius:16px;background:var(--np-switch-off);transition:background-color var(--m-dur-base) var(--m-ease)!important}
.m-switch::before{content:'';position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(23,23,26,.3);transition:transform var(--m-dur-base) var(--m-spring),width var(--m-dur-fast) var(--m-ease)}
.m-switch::after{content:'';position:absolute;inset:-8px -4px}
.m-switch[aria-checked=true]{background:var(--np-ink)}
.m-switch[aria-checked=true]::before{transform:translateX(20px)}
.m-switch:active::before{width:28px}
.m-switch[aria-checked=true]:active::before{transform:translateX(16px)}
/* botones y chips */
.m-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 24px;border-radius:var(--m-r-ctl);background:var(--np-ink);color:var(--np-on-ink)!important;font:600 16px var(--np-font-ui)}
.m-btn.sec{background:transparent;color:var(--np-ink)!important;box-shadow:inset 0 0 0 1.5px var(--np-line3)}
.m-btn.soft{background:var(--np-soft);color:var(--np-ink)!important}
.m-btn.acc{background:var(--np-accent)}
.m-btn.danger{background:var(--np-bad-bg);color:var(--np-bad)!important}
.m-btn.sm{height:48px;font-size:15px;border-radius:14px}
.m-chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:20px;background:var(--np-card);box-shadow:inset 0 0 0 1px var(--np-line3);font:500 14px var(--np-font-ui);position:relative}
.m-chip::after{content:'';position:absolute;inset:-4px 0}
.m-chip[aria-pressed=true]{background:var(--np-ink);color:var(--np-on-ink);box-shadow:none}
.m-seg{display:flex;padding:4px;border-radius:18px;background:var(--np-chrome);gap:2px}
.m-seg>button{flex:1;height:44px;border-radius:14px;font:500 14px var(--np-font-ui);color:var(--np-muted)}
.m-seg>button[aria-selected=true],.m-seg>button[aria-pressed=true]{background:var(--np-card);color:var(--np-ink);box-shadow:0 1px 3px rgba(23,23,26,.14)}
.m-card{background:var(--np-card);border:1px solid var(--np-line2);border-radius:var(--m-r-card)}
.m-leanbar{display:flex;gap:1px;height:4px;border-radius:2px;overflow:hidden}
.m-leanbar i{display:block}.m-leanbar i:nth-child(1){background:var(--np-left)}.m-leanbar i:nth-child(2){background:var(--np-center)}.m-leanbar i:nth-child(3){background:var(--np-right)}
/* barra de pestañas */
.m-tabbar{flex:none;position:relative;display:grid;grid-template-columns:repeat(4,1fr);height:calc(var(--m-tabbar) + var(--m-bottom));padding:0 4px var(--m-bottom);background:var(--np-paper);border-top:1px solid var(--np-line)}
.m-tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding-top:8px;color:var(--np-muted);font:500 12px/1 var(--np-font-ui);min-height:var(--m-hit)}
.m-tab .pill{position:relative;width:64px;height:32px;display:flex;align-items:center;justify-content:center}
.m-tab .pill::before{content:'';position:absolute;inset:0;border-radius:16px;background:var(--np-accent-soft);transform:scaleX(.35);opacity:0;transition:transform var(--m-dur-base) var(--m-ease),opacity var(--m-dur-fast) var(--m-ease)}
.m-tab svg{position:relative;width:24px;height:24px;transition:transform var(--m-dur-base) var(--m-spring)}
.m-tab[aria-current=page]{color:var(--np-ink)}
.m-tab[aria-current=page] .pill::before{transform:none;opacity:1}
.m-tab[aria-current=page] svg{color:var(--np-accent)}
.m-tab[aria-current=page] .fill{fill:currentColor;fill-opacity:.16}
.m-tab:active svg{transform:scale(.88)}
.m-tab .badge{position:absolute;top:2px;right:16px;min-width:8px;height:8px;border-radius:4px;background:var(--np-left);box-shadow:0 0 0 2px var(--np-paper)}
/* hoja inferior */
.m-scrim{position:absolute;inset:0;background:rgba(23,23,26,.42);animation:m-fade var(--m-dur-base) var(--m-ease) both;z-index:20}
.m-sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--np-card);border-radius:28px 28px 0 0;padding:12px 20px calc(var(--m-bottom) + 12px);box-shadow:0 -12px 40px rgba(23,23,26,.18);animation:m-sheet var(--m-dur-sheet) var(--m-spring) both}
.m-grab{width:36px;height:4px;border-radius:2px;background:var(--np-line3);margin:0 auto 14px}
/* esqueletos */
.m-skel{display:block;border-radius:8px;background:linear-gradient(100deg,var(--np-chrome) 30%,#F4F1EB 50%,var(--np-chrome) 70%);background-size:300% 100%;animation:m-shimmer var(--m-dur-shimmer) linear infinite}
/* animaciones */
.m-rise{animation:m-rise var(--m-dur-slow) var(--m-ease) both}
.m-enter{animation:m-push-in var(--m-dur-base) var(--m-ease-emph) both}
.m-fadein{animation:m-fade var(--m-dur-base) var(--m-ease) both}
.m-pop{animation:m-pop var(--m-dur-slow) var(--m-spring) both}
.m-stagger>*{animation:m-rise var(--m-dur-slow) var(--m-ease) both;animation-delay:calc(var(--i,0)*var(--m-stagger))}
.m-stagger>*:nth-child(2){--i:1}.m-stagger>*:nth-child(3){--i:2}.m-stagger>*:nth-child(4){--i:3}.m-stagger>*:nth-child(5){--i:4}.m-stagger>*:nth-child(6){--i:5}.m-stagger>*:nth-child(7){--i:6}.m-stagger>*:nth-child(8){--i:7}.m-stagger>*:nth-child(n+9){--i:8}
@keyframes m-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes m-fade{from{opacity:0}to{opacity:1}}
@keyframes m-push-in{from{opacity:.4;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes m-push-under{from{transform:none}to{transform:translateX(-24%);opacity:.6}}
@keyframes m-pop-out{from{transform:none;opacity:1}to{transform:translateX(32px);opacity:0}}
@keyframes m-sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes m-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes m-shimmer{from{background-position:100% 0}to{background-position:-200% 0}}
@keyframes m-ring{from{stroke-dashoffset:var(--len,100)}to{stroke-dashoffset:var(--to,0)}}
@keyframes m-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes m-pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes m-spin{to{transform:rotate(360deg)}}
@keyframes m-scan{0%{transform:translateY(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(var(--h,240px));opacity:0}}
@keyframes m-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){
  .m-app *,.m-app *::before,.m-app *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .m-skel{animation:none!important;background:var(--np-chrome)}
}
/* simulación de "reducir movimiento" (los mockups la activan con la clase m-reduce en la raíz) */
.m-reduce *,.m-reduce *::before,.m-reduce *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
.m-reduce .m-skel{animation:none!important;background:var(--np-chrome)}
.m-btn.paper{background:var(--np-on-ink);color:var(--np-ink)!important}
.m-app>.m-tabbar{margin-top:auto}
/*@m-base-end*/
.scr{scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
.drw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .38s cubic-bezier(.65,0,.35,1) forwards}
.stamp{animation:stamp .5s cubic-bezier(.34,1.56,.64,1) both}
.grid line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s cubic-bezier(.65,0,.35,1) forwards}
.blinker{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
.tick{animation:tick 38s linear infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes stamp{0%{opacity:0;transform:scale(1.6) rotate(-14deg)}100%{opacity:1;transform:none}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes q0{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes q1{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-14px) rotate(-4deg)}55%{transform:translateY(0) rotate(3deg)}75%{transform:translateY(-5px)}}
@keyframes sag{to{transform:translateY(5px) rotate(-7deg)}}
@keyframes think{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
@keyframes banner{from{transform:translateX(-110%)}to{transform:none}}
@keyframes bump0{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes bump1{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.drw,.grid line{stroke-dashoffset:0!important}}

</style>
</helmet>

<div style="position: relative; width: 350px; height: 330px; background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 22px; overflow: hidden; box-shadow: 0 10px 26px rgba(23,23,26,.06); box-sizing: border-box">
<div style="position: absolute; left: 24px; top: 14px; width: 300px; height: 300px">
<svg class="grid" width="300" height="300" viewBox="0 0 300 300" fill="none" stroke="#17171A" stroke-width="3" stroke-linecap="round" style="position: absolute; inset: 0; pointer-events: none">
<line x1="100" y1="8" x2="101" y2="292" pathLength="1"></line>
<line x1="200" y1="10" x2="199" y2="290" pathLength="1" style="animation-delay: .12s"></line>
<line x1="8" y1="100" x2="292" y2="99" pathLength="1" style="animation-delay: .24s"></line>
<line x1="10" y1="200" x2="290" y2="201" pathLength="1" style="animation-delay: .36s"></line>
</svg>
<div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, 100px)">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="9">
<button onClick="{{c.play}}" aria-label="{{c.aria}}" style="{{c.style}}">
<sc-if value="{{c.isX}}" hint-placeholder-val="{{ false }}"><svg width="62" height="62" viewBox="0 0 100 100" fill="none" stroke="#17171A" stroke-width="9" stroke-linecap="round"><path class="drw" pathLength="1" d="M26 24 Q50 50 75 76"></path><path class="drw" pathLength="1" d="M75 25 Q48 52 25 75" style="animation-delay: .2s"></path></svg></sc-if>
<sc-if value="{{c.isO}}" hint-placeholder-val="{{ false }}"><svg class="stamp" width="66" height="66" viewBox="0 0 100 100" fill="none" stroke="#A3271B" stroke-width="9" stroke-linecap="round"><circle class="drw" pathLength="1" cx="50" cy="50" r="27" transform="rotate(-80 50 50)"></circle><circle cx="50" cy="50" r="37" stroke-width="1.5" stroke-dasharray="2 5" opacity=".45"></circle></svg></sc-if>
</button>
</sc-for>
</div>
<sc-if value="{{hasLine}}" hint-placeholder-val="{{ false }}">
<svg width="300" height="300" viewBox="0 0 300 300" fill="none" style="position: absolute; inset: 0; pointer-events: none"><line class="drw" pathLength="1" x1="{{line.x1}}" y1="{{line.y1}}" x2="{{line.x2}}" y2="{{line.y2}}" stroke="{{line.col}}" stroke-width="9" stroke-linecap="round" style="animation-duration: .6s; animation-delay: .25s"></line></svg>
</sc-if>
</div>
<sc-if value="{{over}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; bottom: 16px; display: flex; flex-direction: column; animation: banner .8s cubic-bezier(.34,1.3,.64,1) .7s both">
<div style="display: flex; align-items: stretch; background: #17171A; color: #F6F4EF; box-shadow: 0 12px 26px rgba(23,23,26,.3)">
<span style="{{bannerTag}}">{{bannerKick}}</span>
<span style="flex: 1; padding: 10px 12px; font-family: 'Newsreader', serif; font-size: 15px; line-height: 1.3">{{bannerText}}</span>
</div>
<div style="display: flex; justify-content: center; margin-top: 10px"><button onClick="{{reset}}" style="height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: #FFFFFF; color: #17171A; font-weight: 500; box-shadow: 0 6px 18px rgba(23,23,26,.2)">Revancha</button></div>
</div>
</sc-if>
</div>

<div role="group" aria-label="Dificultad" style="display: flex; background: #E7E3DA; border-radius: 12px; padding: 3px; gap: 3px">
<sc-for list="{{diffs}}" as="d" hint-placeholder-count="3"><button onClick="{{d.pick}}" aria-pressed="{{d.aria}}" style="{{d.style}}">{{d.label}}</button></sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 2px solid #17171A; border-bottom: 1px solid #D9D5CC">
<div style="padding: 8px 0; display: flex; align-items: baseline; gap: 8px"><span style="{{scX}}">{{score.x}}</span><span style="font-size: 12px; color: #5E5B55">Tú · ×</span></div>
<div style="padding: 8px 0 8px 12px; border-left: 1px solid #E2DED5; display: flex; align-items: baseline; gap: 8px"><span style="{{scT}}">{{score.t}}</span><span style="font-size: 12px; color: #5E5B55">Tablas</span></div>
<div style="padding: 8px 0 8px 12px; border-left: 1px solid #E2DED5; display: flex; align-items: baseline; gap: 8px"><span style="{{scO}}">{{score.o}}</span><span style="font-size: 12px; color: #A3271B">El Diario</span></div>
</div>
<div style="font-size: 12px; color: #5E5B55; margin-top: -4px">{{turnNote}}</div>
</div>

<div style="background: #17171A; color: #F6F4EF; display: flex; align-items: stretch; overflow: hidden; margin-top: 8px; padding-bottom: 22px">
<span style="flex: none; background: #A3271B; padding: 10px 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em">EN DIRECTO</span>
<div style="flex: 1; overflow: hidden; display: flex; align-items: center">
<div class="tick" style="display: flex; white-space: nowrap; font-family: 'Newsreader', serif; font-size: 14px"><span style="padding-right: 40px">{{ticker}}</span><span style="padding-right: 40px">{{ticker}}</span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    this.state = { b: Array(9).fill(null), turn: 'X', win: null, line: null, mood: 'idle', quip: 'Tú pones las X. Yo pongo la línea editorial.', qk: 0, score: { x: 0, o: 0, t: 0 }, sk: { x: 0, o: 0, t: 0 }, diff: 'red', starter: 'X', thinking: false, game: 1 };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  winner(b) {
    for (const l of this.LINES) { if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { w: b[l[0]], l }; }
    return b.every(Boolean) ? { w: 'T', l: null } : null;
  }
  minimax(b, me) {
    const r = this.winner(b);
    if (r) return { s: r.w === 'O' ? 10 : r.w === 'X' ? -10 : 0 };
    let best = { s: me === 'O' ? -99 : 99, i: -1 };
    b.forEach((v, i) => {
      if (v) return;
      b[i] = me; const sc = this.minimax(b, me === 'O' ? 'X' : 'O').s; b[i] = null;
      if ((me === 'O' && sc > best.s) || (me === 'X' && sc < best.s)) best = { s: sc, i };
    });
    return best;
  }
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  say(mood, quip) { this.setState({ mood, quip, qk: this.state.qk + 1 }); }
  end(r) {
    const s = this.state, k = r.w === 'X' ? 'x' : r.w === 'O' ? 'o' : 't';
    const score = { ...s.score, [k]: s.score[k] + 1 }, sk = { ...s.sk, [k]: s.sk[k] + 1 };
    const q = r.w === 'X' ? ['sad', 'Rectificamos: el lector ha ganado. Fe de erratas mañana, página 47.'] : r.w === 'O' ? ['smug', 'Lo dijimos antes que nadie. Exclusiva mundial.'] : ['surprised', 'Empate técnico, según fuentes de ambas partes.'];
    this.setState({ win: r.w, line: r.l, score, sk, thinking: false, mood: q[0], quip: q[1], qk: s.qk + 1 });
  }
  aiMove() {
    const s = this.state, b = s.b.slice();
    const free = b.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
    if (!free.length) return;
    const rand = { bec: 0.7, red: 0.3, dir: 0 }[s.diff];
    const i = Math.random() < rand ? this.pick(free) : this.minimax(b.slice(), 'O').i;
    b[i] = 'O';
    const r = this.winner(b);
    this.setState({ b, turn: 'X', thinking: false });
    if (r) { this.end(r); return; }
    const threat = this.LINES.some((l) => l.filter((j) => b[j] === 'X').length === 2 && l.some((j) => !b[j]));
    if (threat) this.say('worried', this.pick(['Hmm. Esa diagonal no la habíamos previsto.', 'Nuestros analistas empiezan a sudar tinta.']));
    else this.say('smug', this.pick(['Exclusiva: ficha colocada.', 'Esto va en portada.', 'Lo vimos venir antes que nadie.']));
  }
  play(i) {
    const s = this.state;
    if (s.b[i] || s.win || s.turn !== 'X' || s.thinking) return;
    const b = s.b.slice(); b[i] = 'X';
    const r = this.winner(b);
    this.setState({ b, turn: 'O' });
    if (r) { this.end(r); return; }
    this.setState({ thinking: true, mood: 'thinking', quip: this.pick(['Consultando con la redacción…', 'Contrastando con tres fuentes…', 'Esperando el visto bueno del director…']), qk: s.qk + 1 });
    clearTimeout(this.t);
    this.t = setTimeout(() => this.aiMove(), 850);
  }
  reset() {
    const starter = this.state.starter === 'X' ? 'O' : 'X';
    clearTimeout(this.t);
    this.setState({ b: Array(9).fill(null), win: null, line: null, starter, turn: starter, game: this.state.game + 1, thinking: starter === 'O', mood: starter === 'O' ? 'thinking' : 'idle', quip: starter === 'O' ? 'Esta vez abro yo la edición.' : 'Revancha. Tú pones las X.', qk: this.state.qk + 1 });
    if (starter === 'O') this.t = setTimeout(() => this.aiMove(), 900);
  }
  renderVals() {
    const s = this.state, E = 'cubic-bezier(.22,1,.36,1)';
    const inLine = (i) => !!s.line && s.line.indexOf(i) >= 0;
    const cells = s.b.map((v, i) => ({
      isX: v === 'X', isO: v === 'O',
      aria: v ? (v === 'X' ? 'Casilla ' + (i + 1) + ': equis' : 'Casilla ' + (i + 1) + ': círculo de El Diario') : 'Casilla ' + (i + 1) + ' vacía',
      play: () => this.play(i),
      style: 'border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:14px;transition:opacity .6s ' + E + ',background-color .3s;opacity:' + (s.win && s.win !== 'T' && !inLine(i) ? 0.22 : 1) + ';cursor:' + (v || s.win ? 'default' : 'pointer')
    }));
    let line = null;
    if (s.line) {
      const c = (i) => [(i % 3) * 100 + 50, Math.floor(i / 3) * 100 + 50];
      const a = c(s.line[0]), z = c(s.line[2]);
      const dx = z[0] - a[0], dy = z[1] - a[1], L = Math.hypot(dx, dy), ex = dx / L * 28, ey = dy / L * 28;
      line = { x1: a[0] - ex, y1: a[1] - ey, x2: z[0] + ex, y2: z[1] + ey, col: s.win === 'X' ? '#2340B8' : '#A3271B' };
    }
    const M = {
      idle: ['M66 92 L84 90 M116 90 L134 92', 'M88 138 Q100 145 112 138', '0px,0px'],
      thinking: ['M66 88 L84 90 M116 84 L134 88', 'M92 141 L110 139', '4px,-4px'],
      smug: ['M66 90 L84 95 M116 86 L134 81', 'M84 135 Q102 152 118 132', '0px,0px'],
      worried: ['M66 95 L84 88 M116 88 L134 95', 'M88 143 Q100 135 112 143', '-4px,2px'],
      sad: ['M66 97 L84 90 M116 90 L134 97', 'M86 147 Q100 133 114 147', '0px,4px'],
      surprised: ['M66 84 L84 81 M116 81 L134 84', 'M94 140 a6 7 0 1 0 12 0 a6 7 0 1 0 -12 0', '0px,-2px']
    }[s.mood];
    const anim = s.win === 'O' ? 'animation:jump .9s cubic-bezier(.34,1.56,.64,1) both' : s.win === 'X' ? 'animation:sag .8s ' + E + ' forwards' : s.mood === 'thinking' ? 'animation:think .9s ease-in-out infinite' : 'animation:bob 2.6s ease-in-out infinite';
    const sc = (k, col) => "display:inline-block;font-family:'Newsreader',serif;font-size:30px;line-height:1;color:" + col + ';transform-origin:left center;' + (s.sk[k] ? 'animation:bump' + (s.sk[k] % 2) + ' .6s cubic-bezier(.34,1.56,.64,1)' : '');
    const diffs = [['bec', 'Becario'], ['red', 'Redactor'], ['dir', 'Director']];
    const banner = s.win === 'X' ? ['FE DE ERRATAS', '#2340B8', 'El lector gana al Diario, que promete rectificar'] : s.win === 'O' ? ['ÚLTIMA HORA', '#A3271B', 'El Diario se impone y lo celebra en portada'] : ['EMPATE', '#8A5300', 'Tablas: ambas partes reclaman la victoria'];
    return {
      cells, hasLine: !!line, line: line || { x1: 0, y1: 0, x2: 0, y2: 0, col: '#17171A' },
      over: !!s.win,
      bannerKick: banner[0], bannerText: banner[2],
      bannerTag: 'flex:none;display:flex;align-items:center;padding:0 10px;font-size: 11px;font-weight:600;letter-spacing:.1em;background:' + banner[1],
      reset: () => this.reset(),
      diffs: diffs.map((d) => ({ label: d[1], aria: s.diff === d[0] ? 'true' : 'false', pick: () => this.setState({ diff: d[0] }), style: 'flex:1;height:44px;border:0;border-radius:9px;font-size:14px;' + (s.diff === d[0] ? 'background:#FFFFFF;color:#17171A;font-weight:500;box-shadow:0 1px 2px rgba(23,23,26,.1)' : 'background:transparent;color:#5E5B55') })),
      brows: M[0], mouth: M[1], blush: s.mood === 'smug',
      pupils: 'transition:transform .45s ' + E + ';transform:translate(' + M[2] + ')',
      bodyAnim: anim,
      thinking: s.thinking,
      quip: s.quip,
      bubble: "position:relative;flex:1;background:#FFFFFF;border:1px solid #E2DED5;border-radius:16px;padding:10px 14px;margin-bottom:24px;font-family:'Newsreader',serif;font-size:15px;line-height:1.35;box-shadow:0 6px 16px rgba(23,23,26,.06);animation:q" + (s.qk % 2) + ' .5s ' + E + ' both',
      score: s.score, scX: sc('x', '#17171A'), scT: sc('t', '#5E5B55'), scO: sc('o', '#A3271B'),
      turnNote: s.win ? 'Partida ' + s.game + ' terminada' : s.thinking ? 'Turno de El Diario' : 'Tu turno · partida ' + s.game,
      ticker: 'Lector ' + s.score.x + ' – El Diario ' + s.score.o + ' · Tablas: ' + s.score.t + '   ◆   El Diario niega haber perdido nunca una partida   ◆   Fuentes de la redacción aseguran que el centro es la mejor casilla   ◆   El becario jura que dejó ganar a propósito   ◆   Se recomienda contrastar cada jugada con al menos dos fuentes'
    };
  }
}
</script>
