name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @newpaper/extract build
      - name: i18n (missing keys, ICU, hardcoded UI text)
        run: pnpm i18n:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

  # Informativo: prepara el portado a Linux (Pop!_OS). No bloquea el resto. Ver
  # docs/superpowers/plans/2026-10-09-linux-popos-portado.md
  linux-check:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependencias de Tauri (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev libsecret-1-dev patchelf
      - name: Crates portables (sin GUI)
        run: cargo check --manifest-path src-tauri/Cargo.toml -p np-store -p np-feeds -p np-lexicon -p np-wayback -p np-net -p np-adblock
      - name: Pruebas de crates portables
        run: cargo test --manifest-path src-tauri/Cargo.toml -p np-store -p np-feeds -p np-lexicon -p np-wayback -p np-adblock
      - name: Aplicación completa (aún sin anfitrión Linux; se espera que falle)
        continue-on-error: true
        run: cargo check --manifest-path src-tauri/Cargo.toml -p np-shell -p np-app
